name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi

      - name: Install system dependencies
        run: sudo apt-get install -y libudev-dev
      
      - name: Install flip-link
        run: cargo install flip-link

      - name: Run unit tests before release
        run: |
          rustc --edition 2021 tests/unit_tests.rs --test -o /tmp/unit_tests
          /tmp/unit_tests

      - name: Build release firmware
        run: cargo build --release

      - name: Install elf2uf2-rs
        run: cargo install elf2uf2-rs

      - name: Convert ELF to UF2
        run: |
          elf2uf2-rs \
            target/thumbv6m-none-eabi/release/rp2040-project \
            rp2040-project-${{ github.ref_name }}.uf2

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## RP2040 USB-UART Bridge ${{ github.ref_name }}

            ### Installation
            1. Hold **BOOTSEL** while plugging in USB
            2. Drag and drop `rp2040-project-${{ github.ref_name }}.uf2` onto the `RPI-RP2` drive

            ### Changes
            See [CHANGELOG](CHANGELOG.md) for details.
          files: rp2040-project-${{ github.ref_name }}.uf2
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}