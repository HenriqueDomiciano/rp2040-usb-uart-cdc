name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt-get install -y libudev-dev

      - name: Install tools (flip-link & elf2uf2-rs)
        run: |
          cargo install flip-link
          cargo install elf2uf2-rs

      - name: Run unit tests before release
        run: |
          rustc --edition 2021 tests/unit_tests.rs --test -o /tmp/unit_tests
          /tmp/unit_tests

      - name: Build release firmware RP2040-zero
        run: cargo build --release

      - name: Convert ZERO ELF to UF2
        run: |
          elf2uf2-rs \
            target/thumbv6m-none-eabi/release/rp2040-usb-cdc \
            rp2040-project-zero-${{ github.ref_name }}.uf2

      - name: Build release firmware RP2040-dev
        run: cargo build --release --no-default-features --features rp-2040-board-dev

      - name: Convert DEV ELF to UF2
        run: |
          elf2uf2-rs \
            target/thumbv6m-none-eabi/release/rp2040-usb-cdc \
            rp2040-project-dev-${{ github.ref_name }}.uf2

      # --- 3. CREATE GITHUB RELEASE ---
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## RP2040 USB-UART Bridge ${{ github.ref_name }}

            ### Installation
            1. Hold **BOOTSEL** while plugging in USB
            2. Drag and drop the correct `.uf2` file for your board onto the `RPI-RP2` drive:
               - For RP2040 Zero: `rp2040-project-zero-${{ github.ref_name }}.uf2`
               - For Dev Board: `rp2040-project-dev-${{ github.ref_name }}.uf2`

            ### Changes
            See [CHANGELOG](CHANGELOG.md) for details.
          files: |
            rp2040-project-zero-${{ github.ref_name }}.uf2
            rp2040-project-dev-${{ github.ref_name }}.uf2
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}