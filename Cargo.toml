[package]
name = "rp2040-project"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
# Required runtime boot architecture
cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = "0.7.0"
static_cell = "2.1.0"
portable-atomic = { version = "1.0", features = ["critical-section"] }
smart-leds = "0.4.0"
defmt = "1.0.1"
defmt-rtt = "1.0.0"
fixed = "1.23.1"
fixed-macro = "1.2"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
libm = "0.2.16"
embedded-io-async = "0.7.0"

# Embassy crates - all pinned to the same git rev to avoid embassy-hal-internal version conflicts
embassy-rp = { git = "https://github.com/embassy-rs/embassy",branch="main", features = ["defmt", "time-driver", "critical-section-impl", "rp2040"] }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", branch="main", features = ["executor-thread", "platform-cortex-m", "defmt"] }
embassy-time = { git = "https://github.com/embassy-rs/embassy", branch="main", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-usb = { git = "https://github.com/embassy-rs/embassy", branch="main", features = ["defmt","max-interface-count-8"]}
embassy-futures = { git = "https://github.com/embassy-rs/embassy", branch="main" }
embassy-embedded-hal = { git = "https://github.com/embassy-rs/embassy", branch="main" }
embassy-sync = "0.8.0"
rp-pac = {version = "7.0.0", features=["rp2040"]}

[package.metadata.embassy_rp]
task_arena_size = 65536
